[project]
name = "clanker-poker-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "treys>=0.1.8",
    "litellm>=1.83.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "redis>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.3.0",
    "httpx-sse>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["app"]
